name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:

  # ── Build & push Docker images ───────────────────────────────────
  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository | toLowerCase() }}/backend:latest
            ghcr.io/${{ github.repository | toLowerCase() }}/backend:${{ steps.tag.outputs.TAG }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          file: app/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository | toLowerCase() }}/frontend:latest
            ghcr.io/${{ github.repository | toLowerCase() }}/frontend:${{ steps.tag.outputs.TAG }}

  # ── Security scan on Docker images ──────────────────────────────
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository | toLowerCase() }}/backend:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  # ── Deploy via SSH ───────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build, trivy]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/waste-sorter
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec backend alembic upgrade head
            echo "Deploy done — $(date)"

name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:

  # ────────────────────────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGES
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      repo_name: ${{ steps.repo_name.outputs.REPO_NAME }}
      image_tag: ${{ steps.image_tag.outputs.TAG }}

    steps:
      - uses: actions/checkout@v4

      # Convert repo name to lowercase and export it
      - name: Set repo name lowercase
        id: repo_name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image_tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_NAME }}/backend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_NAME }}/backend:${{ steps.image_tag.outputs.TAG }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: app/frontend
          file: app/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_NAME }}/frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO_NAME }}/frontend:${{ steps.image_tag.outputs.TAG }}

  # ────────────────────────────────────────────────────────────────
  # TRIVY SECURITY SCAN
  # ────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ needs.build.outputs.repo_name }}/backend:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  # ────────────────────────────────────────────────────────────────
  # DEPLOY TO SERVER
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build, trivy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /app/waste-sorter
            docker compose pull
            docker compose up -d --remove-orphans
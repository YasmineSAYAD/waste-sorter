name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────
# BACKEND + FRONTEND JOBS
# ─────────────────────────────────────────────────────────────────

jobs:

  # ── Lint + Type check — Backend ───────────────────────────────────
  lint-backend:
    name: Lint & Type check — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Ruff — lint (E, F, W)
        run: ruff check app/backend/ --select E,F,W

      - name: Mypy — type check
        run: mypy app/backend/ --ignore-missing-imports

  # ── Lint — Frontend Streamlit ─────────────────────────────────────
  lint-frontend:
    name: Lint — Frontend Streamlit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: Ruff — lint app.py (E, F, W)
        run: ruff check app/frontend/ --select E,F,W

  # ── Security scan ─────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit — backend scan
        run: bandit -r app/backend/ -ll -x app/backend/tests/

      - name: Bandit — frontend scan
        run: bandit -r app/frontend/ -ll

      - name: Safety — dependency vulnerabilities
        run: safety check --file app/backend/requirements.txt

      - name: Gitleaks — secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tests — Backend ───────────────────────────────────────────────
  tests-backend:
    name: Pytest — Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      MODEL_PATH: model/saved/yolo_best.pt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/backend/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Pytest with coverage
        run: |
          pytest app/backend/tests/ \
            --cov=app/backend \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

# ─────────────────────────────────────────────────────────────────
# ML JOBS — notebooks + src
# ─────────────────────────────────────────────────────────────────

  # ── Notebooks — lint & outputs check ─────────────────────────────
  notebooks:
    name: Notebooks — lint & outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook tools
        run: pip install nbstripout nbqa ruff

      - name: Check notebooks have no outputs
        run: |
          for nb in model/notebooks/*.ipynb; do
            nbstripout --verify "$nb" && echo "$nb — OK"
          done

      - name: Ruff — lint notebooks (E, F, W)
        run: nbqa ruff model/notebooks/ --select E,F,W --ignore E501

      - name: Ruff — lint model/src scripts (E, F, W)
        run: ruff check model/src/*.py --select E,F,W

# ─────────────────────────────────────────────────────────────────
# SEMANTIC RELEASE 
# ─────────────────────────────────────────────────────────────────

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - security
      - tests-backend
      - notebooks
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git

      - name: Run semantic-release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
